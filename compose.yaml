services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: grantfolio
      POSTGRES_PASSWORD: grantfolio
      POSTGRES_DB: grantfolio
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantfolio"]
      interval: 2s
      timeout: 3s
      retries: 20
  auth:
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    volumes: ["auth-data:/var/lib/grantfolio-auth"]
    build:
      context: .
      dockerfile: infra/Dockerfile.emulator
    ports: ["127.0.0.1:9099:9099"]
volumes:
  auth-data:
  postgres-data:
